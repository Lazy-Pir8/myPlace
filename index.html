<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Place</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="viewport"></canvas>

<div class="readout" role="status" aria-live="off">
    <div class="readout__cell">
        <span class="readout__label">Cell</span>
        <span class="readout__value" id="coords">—</span>
    </div>
    <div class="readout__rule" aria-hidden="true"></div>
    <div class="readout__cell">
        <span class="readout__label">Zoom</span>
        <span class="readout__value" id="zoom">1.0×</span>
    </div>
</div>

<div class="keys" aria-hidden="true">
    <span><b>drag</b> paint</span>
    <span><b>space</b> or <b>right-drag</b> pan</span>
    <span><b>scroll</b> zoom</span>
    <span><b>1–9</b> colour</span>
    <span><b>E</b> erase</span>
    <span><b>G</b> grid</span>
    <span><b>R</b> reset</span>
    <span><b>⌘Z</b> undo</span>
    
</div>

<div class="export-panel">
    <button id="exportPng" type="button">PNG</button>
    <button id="exportData" type="button">Data</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="dock">
    <div class="palette" id="palette" role="group" aria-label="Colour palette"></div>
</div>

<script src="main.js"></script>
</body>
</html>
