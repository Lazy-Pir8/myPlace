<!DOCTYPE html>
<html>

<head>
    <title>My r/place</title>

    <style>

        body {
            display: flex;
            gap: 20px;
            margin: 20px;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }


        #palette {
            width: 180px;
            height: fit-content;
            padding: 15px;

            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            background: white;
            border: 2px solid black;
            border-radius: 10px;
        }


        #palette div {
            width: 35px;
            height: 35px;

            cursor: pointer;

            border: 1px solid black;
            border-radius: 5px;
        }


        #palette div:hover {
            transform: scale(1.1);
        }


        #viewport {
            border: 3px solid black;
            background: white;

            image-rendering: pixelated;
        }

    </style>

</head>

<body>


    <div id="palette"></div>


    <canvas 
        id="viewport"
        width="2500"
        height="2500">
    </canvas>


    <script src="script.js"></script>


</body>


</html>
